<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2a8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NEXUS CONNECTION</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="locked">
<div id="desk">
  <div id="winwrap">
    <div id="win">
      <div id="titlebar"><span class="appico">🩸</span><span id="win-title">Nexus Connection</span><span id="tb-net">Online</span></div>
      <div id="scr">
        <div id="app"><div class="lock"><div class="mut" style="color:#fff">Caricamento…</div></div></div>
      </div>
    </div>
  </div>

  <div id="taskbar">
    <button class="tb-btn" id="tb-start" title="Home" aria-label="Home">⊞</button>
    <button class="tb-btn" id="tb-back" title="Indietro" aria-label="Indietro">←</button>
    <span id="tb-title">Nexus Connection</span>
    <span id="tb-tray"></span>
    <span id="tb-clockw"><b id="tb-clock">--:--</b><small id="tb-date"></small></span>
    <button class="tb-btn" id="mbtn" title="Accesso Master">🔑<span class="lbl">Master</span></button>
  </div>
</div>

<!-- 1. libreria Supabase (versione fissata) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<!-- 2. configurazione (da compilare) -->
<script src="js/config.js"></script>
<!-- 3. adattatore dati (db, utente, upload foto) -->
<script src="js/backend.js"></script>
<!-- 4. app -->
<script src="js/app.js"></script>
</body>
</html>
